<!DOCTYPE html><html lang="es-CO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPM PQR 360 · Prototipo académico</title><meta name="robots" content="noindex"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--g:#00A859;--g2:#008746;--g3:#e6f6ee;--n:#003B5C;--n2:#00263d;--n3:#e8f0f5;--bg:#f4f7f9;--card:#fff;--tx:#1b2a35;--mu:#5d6d7a;--bd:#e1e7ec;--warn:#c98a00;--warn3:#fff5d9;--red:#c93c3c;--red3:#fde9e9;--blue:#1f6fb2;--blue3:#e6f0fa;--pur:#7b4fc9;--pur3:#f1eafb;--org:#d9741c;--org3:#fdefe2;--r:14px;--sh:0 1px 2px rgba(16,40,60,.06),0 6px 18px rgba(16,40,60,.07)}
body.dark{--bg:#0e1a23;--card:#15242f;--tx:#e5edf2;--mu:#9db0be;--bd:#263a4a;--n3:#1b3242;--g3:#12392a;--warn3:#3a3112;--red3:#3d1d1d;--blue3:#16304a;--pur3:#2b2140;--org3:#3a2817}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--tx);background:var(--bg);line-height:1.5;font-size:15px}
a{color:var(--g2)}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em;color:var(--tx);font-family:"Plus Jakarta Sans",Inter,"Segoe UI",sans-serif;letter-spacing:-.01em}
p{margin:0 0 .8em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #ffbf47;outline-offset:2px;border-radius:6px}
.ic{flex:none;vertical-align:middle}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:600}.tr{text-align:right}.nowrap{white-space:nowrap}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mt{margin-top:16px}.mt2{margin-top:28px}.mb{margin-bottom:16px}
.proto-ribbon{background:#1b2a35;color:#ffe08a;font-size:12.5px;text-align:center;padding:5px 10px;position:relative;z-index:60}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s;background:var(--card);color:var(--tx);line-height:1.2}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--g);color:#fff}.btn-primary:hover:not(:disabled){background:var(--g2)}
.btn-navy{background:var(--n);color:#fff}.btn-navy:hover{background:var(--n2)}
.btn-ghost{background:transparent;border-color:var(--bd);color:var(--tx)}.btn-ghost:hover{background:var(--n3)}
.btn-white{background:#fff;color:var(--n)}
.btn-danger{background:var(--red);color:#fff}
.btn-warn{background:#f2a900;color:#1b2a35}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn-xs{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}
.iconbtn{background:transparent;border:1px solid var(--bd);border-radius:10px;padding:7px;cursor:pointer;display:inline-flex;position:relative;color:var(--tx)}
.iconbtn:hover{background:var(--n3)}
.dot{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-weight:700}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card h3{font-size:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:flex-start}
.kpi .k-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.kpi b{display:block;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mu)}
.c-g{background:var(--g3);color:var(--g2)}.c-n{background:var(--n3);color:var(--n)}.c-w{background:var(--warn3);color:var(--warn)}.c-r{background:var(--red3);color:var(--red)}.c-p{background:var(--pur3);color:var(--pur)}.c-b{background:var(--blue3);color:var(--blue)}.c-o{background:var(--org3);color:var(--org)}
body.dark .c-n{color:#8fc3e6}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.st-rad{background:var(--blue3);color:var(--blue)}.st-ami{background:var(--pur3);color:var(--pur)}.st-vis{background:var(--warn3);color:var(--warn)}.st-ana{background:var(--org3);color:var(--org)}.st-ok{background:var(--g3);color:var(--g2)}.st-no{background:var(--red3);color:var(--red)}.st-closed{background:#e9edf0;color:#4d5d69}
body.dark .st-closed{background:#24333e;color:#b6c4ce}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--n3);font-size:12px;color:var(--n);font-weight:600}
body.dark .tag{color:#9cc8e8}
/* SLA */
.sla{height:7px;background:var(--bd);border-radius:9px;overflow:hidden;min-width:70px}
.sla>i{display:block;height:100%;border-radius:9px}
.lv-green{background:var(--g)}.lv-yellow{background:#f2a900}.lv-red{background:var(--red)}
.sla-cell{min-width:110px}
/* formularios */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label,.lbl{font-weight:600;font-size:13.5px}
.req{color:var(--red)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid #c9d4dc;border-radius:10px;background:var(--card);color:var(--tx)}
body.dark .input{border-color:#33495a}
.input:focus{border-color:var(--g);outline:none;box-shadow:0 0 0 3px rgba(0,168,89,.18)}
.input[readonly]{background:var(--n3)}
.input.bad{border-color:var(--red)}
.help{font-size:12px;color:var(--mu)}
.err{font-size:12.5px;color:var(--red);font-weight:600;min-height:0}
.err:empty{display:none}
.pw{position:relative}.pw .input{padding-right:44px}
.pw-t{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--mu);padding:6px;display:flex}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--g)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 18px}
.fsec{border:1px solid var(--bd);border-radius:12px;padding:16px 16px 4px;margin-bottom:16px}
.fsec>legend{font-weight:700;padding:0 6px;color:var(--n)}
body.dark .fsec>legend{color:#9cc8e8}
.upl{border:2px dashed #c9d4dc;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.upl img{width:86px;height:86px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:#fff}
.alert{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.alert-warn{background:var(--warn3);color:#6d4c00}.alert-err{background:var(--red3);color:var(--red)}.alert-ok{background:var(--g3);color:var(--g2)}.alert-info{background:var(--blue3);color:var(--blue)}
body.dark .alert-warn{color:#ffd77a}
/* tablas */
.tbl-wrap{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:var(--n3);text-align:left;padding:10px 12px;font-size:12.5px;color:var(--mu);white-space:nowrap;position:sticky;top:0}
.tbl th.sort{cursor:pointer;user-select:none}.tbl th.sort:hover{color:var(--tx)}
.tbl td{padding:10px 12px;border-top:1px solid var(--bd);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--n3)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters .field{margin:0;min-width:150px;flex:1}
.search{position:relative;flex:2;min-width:220px}.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu)}.search .input{padding-left:36px}
.empty{text-align:center;padding:40px 20px;color:var(--mu)}
.empty .ic{color:var(--g);margin-bottom:6px}
/* modal / drawer */
.backdrop{position:fixed;inset:0;background:rgba(10,25,38,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--card);color:var(--tx);border-radius:16px;max-width:620px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s}
.modal.wide{max-width:1000px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--card);z-index:2}
.modal-h h2{font-size:18px;margin:0}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.backdrop.drawer-bd{justify-content:flex-end;padding:0}
.drawer{background:var(--card);color:var(--tx);width:min(760px,100%);height:100%;overflow:auto;animation:slide .2s}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.97);opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:0}}
/* toasts */
#toasts{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:#13232f;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;font-size:14px;animation:pop .2s;border-left:5px solid var(--g)}
.toast.err{border-color:var(--red)}.toast.warn{border-color:#f2a900}.toast.info{border-color:#4aa3e0}
/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 6px}
.tl li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--bd)}
.tl li:last-child{border-color:transparent}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--g);border:2px solid var(--card);box-shadow:0 0 0 2px var(--g)}
.tl li.h::before{background:var(--n);box-shadow:0 0 0 2px var(--n)}
.tl b{display:block;font-size:14px}.tl small{color:var(--mu)}
.steps-p{list-style:none;padding:0;margin:0}
.steps-p li{display:flex;gap:12px;align-items:center;padding:10px 0;color:var(--mu)}
.steps-p li .s-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bd)}
.steps-p li.on{color:var(--tx);font-weight:600}.steps-p li.on .s-ic{border-color:var(--g);color:var(--g)}
.steps-p li.done{color:var(--tx)}.steps-p li.done .s-ic{background:var(--g);border-color:var(--g);color:#fff}
.spin{width:16px;height:16px;border:2px solid var(--g3);border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--bd) 25%,var(--n3) 50%,var(--bd) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--mu)}dl.kv dd{margin:0;font-weight:600}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mu);font-size:11px}
.chart .ch-val{fill:var(--tx);font-weight:700;font-size:11.5px}
.chart .grid-l{stroke:var(--bd)}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut-num{fill:var(--tx);font-size:26px;font-weight:800}.donut-lbl{fill:var(--mu);font-size:11px}
.legend{list-style:none;padding:0;margin:0;font-size:13px;display:flex;flex-direction:column;gap:5px;min-width:170px}
.legend li{display:flex;align-items:center;gap:8px}.legend i{width:11px;height:11px;border-radius:3px;flex:none}.legend b{margin-left:auto;padding-left:12px}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sem div{border-radius:12px;padding:14px;text-align:center}
.sem b{display:block;font-size:26px}
/* ===== SITIO PÚBLICO ===== */
.utility{background:var(--n2);color:#cfe0ea;font-size:12.5px}
.utility .wrap{display:flex;justify-content:space-between;gap:10px;padding-top:6px;padding-bottom:6px;flex-wrap:wrap}
.utility a,.utility button{color:#cfe0ea;text-decoration:none;margin-right:14px;background:none;border:0;cursor:pointer;padding:0;font-size:12.5px}
.utility a.on{color:#fff;font-weight:700}
.site-h{background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.site-h .wrap{display:flex;align-items:center;gap:18px;height:70px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--n)}
.logo-mark{background:var(--g);color:#fff;font-weight:900;letter-spacing:.5px;border-radius:12px;padding:7px 10px;font-size:19px;line-height:1}
.logo-txt{font-size:12.5px;line-height:1.15;font-weight:600;color:var(--n)}
.logo-txt small{display:block;font-weight:500;color:var(--mu);font-size:11px}
.mainnav{display:flex;gap:2px;margin-left:auto}
.mainnav button{white-space:nowrap;background:none;border:0;padding:8px 9px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--n);font-size:14px}
.mainnav button:hover{background:var(--g3);color:var(--g2)}
.h-actions{display:flex;gap:8px;align-items:center}
.only-m{display:none}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--n2),var(--n) 55%,#00574a);color:#fff;min-height:560px}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;display:flex;align-items:center}
.slide.on{opacity:1;position:relative}
.slide .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;padding-top:56px;padding-bottom:64px;width:100%}
.hero h1{color:#fff;font-size:clamp(30px,4.6vw,58px);font-weight:800;line-height:1.08}
.hero p{font-size:17px;color:#d5e6ef;max-width:560px}
.hero .eyebrow{display:inline-block;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:99px;font-size:13px;margin-bottom:14px}
.hero-art{display:flex;justify-content:center}
.hero-dots{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.hero-dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.4);cursor:pointer;padding:0}
.hero-dots button.on{background:#fff;width:26px;border-radius:9px}
.quick{margin-top:-40px;position:relative;z-index:5}
.quick .grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.qa{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:18px 14px;text-align:center;border:1px solid var(--bd);cursor:pointer;text-decoration:none;color:var(--n);font-weight:600;font-size:14px;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:8px}
.qa:hover{transform:translateY(-3px);border-color:var(--g)}
.qa .ic{color:var(--g)}
.sec{padding:64px 0}
.sec.alt{background:#fff}
.sec-h{text-align:center;max-width:720px;margin:0 auto 34px}
.sec-h .kick{color:var(--g2);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.sec-h h2{font-size:clamp(24px,3vw,34px);color:var(--n)}
.svc{border-top:5px solid var(--g)}
.svc .svc-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:12px}
.svc ul{padding-left:18px;margin:8px 0 0;color:var(--mu);font-size:14px}
.pqr-band{background:linear-gradient(110deg,var(--g2),var(--g));color:#fff;border-radius:20px;padding:34px;display:grid;grid-template-columns:1fr 1.3fr;gap:30px;align-items:center}
.pqr-band h2{color:#fff}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.steps4 div{background:rgba(255,255,255,.14);border-radius:14px;padding:14px;font-size:14px}
.steps4 b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--g2);margin-bottom:8px}
.stat{text-align:center}
.stat b{display:block;font-size:34px;color:var(--g2);font-weight:800;font-variant-numeric:tabular-nums}
.news .thumb{height:140px;border-radius:12px;margin:-4px -4px 14px;display:grid;place-items:center;color:#fff}
.faq details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:600;color:var(--n)}
.faq details[open] summary{margin-bottom:8px}
.site-f{background:var(--n2);color:#bcd1de;padding:48px 0 20px;font-size:14px}
.site-f h4{color:#fff;font-size:15px}
.site-f a,.site-f button{color:#bcd1de;text-decoration:none;display:block;margin:4px 0;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-size:14px}
.site-f .legal{border-top:1px solid #23465d;margin-top:30px;padding-top:16px;font-size:12.5px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;cursor:pointer;color:var(--mu)}
.tabs button.on{border-color:var(--g);color:var(--g2)}
/* ===== LOGIN ===== */
.auth{min-height:calc(100vh - 28px);display:grid;grid-template-columns:1fr 1fr}
.auth-side{background:linear-gradient(150deg,var(--g2),var(--n) 80%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.auth-side h2{color:#fff;font-size:30px}
.auth-side ul{list-style:none;padding:0;margin:20px 0 0}
.auth-side li{display:flex;gap:10px;margin-bottom:14px;color:#dff0e8}
.auth-side .logo-txt,.auth-side .logo-txt small{color:#fff}
.auth-main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:16px}
.auth-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:30px;box-shadow:var(--sh)}
.auth-card h1{font-size:24px;color:var(--n)}
.auth-admin{background:radial-gradient(circle at 20% 10%,#0a4f78,var(--n2) 60%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:30px 16px}
.auth-admin .auth-card{border-top:5px solid var(--g)}
.demo{width:100%;max-width:440px;background:var(--warn3);border:1px dashed #e0b84a;border-radius:14px;padding:12px 16px;font-size:13px;color:#5e4700}
.demo summary{cursor:pointer;font-weight:700}
.demo table{width:100%;font-size:12.5px;border-collapse:collapse;margin-top:8px}.demo td{padding:3px 4px;border-top:1px solid #edd795}
.demo button.lnk{background:none;border:0;color:#7a5a00;text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
/* ===== PORTAL CLIENTE ===== */
.portal-h{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40}
.portal-h .wrap{display:flex;align-items:center;gap:16px;min-height:66px;flex-wrap:wrap}
.ptabs{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
.ptabs a{text-decoration:none;color:var(--n);font-weight:600;padding:8px 12px;border-radius:9px;font-size:14px;display:flex;gap:6px;align-items:center;position:relative}
.ptabs a.on{background:var(--g3);color:var(--g2)}
.ptabs a:hover{background:var(--n3)}
.ptabs .dot{position:static;margin-left:2px}
.p-user{margin-left:auto;display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--n);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.p-uinfo{line-height:1.2;font-size:13.5px}.p-uinfo small{color:var(--mu);display:block}
.portal-main{padding-top:24px;padding-bottom:60px}
.welcome{background:linear-gradient(115deg,var(--n),#00574a);color:#fff;border-radius:18px;padding:26px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.welcome h1{color:#fff;font-size:24px}
.welcome p{color:#d5e6ef;margin:0}
.req-card{border-left:5px solid var(--g);cursor:pointer;transition:.15s}
.req-card:hover{transform:translateY(-2px)}
.result{border-radius:16px;padding:20px;border:2px solid}
.result.ok{border-color:var(--g);background:var(--g3)}.result.no{border-color:var(--red);background:var(--red3)}.result.wait{border-color:#f2a900;background:var(--warn3)}
.n8n-box{border:1px solid #ea4b71;background:#fff1f5;border-radius:12px;padding:12px 14px;margin-top:12px}
body.dark .n8n-box{background:#3a1b25}
.btn-n8n{background:#ea4b71;color:#fff}.btn-n8n:hover{background:#d13a60}
/* chatbot */
.chat-fab{position:fixed;right:20px;bottom:20px;z-index:80;width:60px;height:60px;border-radius:50%;background:var(--g);color:#fff;border:0;box-shadow:0 10px 26px rgba(0,120,60,.4);cursor:pointer;display:grid;place-items:center}
.chat-panel{position:fixed;right:20px;bottom:92px;z-index:80;width:min(380px,calc(100vw - 30px));height:min(560px,calc(100vh - 130px));background:var(--card);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--bd)}
.chat-h{background:var(--n);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
.chat-h .avatar{background:var(--g)}
.chat-h small{display:block;color:#bfe3d0;font-size:12px}
.chat-b{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px}
.msg.bot{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--g);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.qr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qr button{background:var(--g3);color:var(--g2);border:1px solid #b9e6cf;border-radius:99px;padding:5px 10px;font-size:12.5px;cursor:pointer;font-weight:600}
.typing{display:flex;gap:4px;padding:12px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.chat-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
.chat-f input{flex:1}

.admin{display:flex;min-height:calc(100vh - 28px)}
.sidebar{width:248px;background:var(--n2);color:#cfe0ea;flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid #1d4660}
.sb-brand b{color:#fff;display:block;font-size:15px}.sb-brand small{font-size:12px;color:#9fbccd}
.sidebar nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.sidebar nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:10px;color:#cfe0ea;text-decoration:none;font-size:14px;font-weight:500}
.sidebar nav a:hover{background:#0f3a55}
.sidebar nav a.on{background:var(--g);color:#fff;font-weight:700}
.sidebar nav a .dot{position:static;margin-left:auto}
.sb-foot{padding:12px 10px;border-top:1px solid #1d4660}
.sb-foot a{color:#9fbccd;text-decoration:none;font-size:13px;display:flex;gap:8px;align-items:center;padding:8px 12px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:19px;margin:0}
.tb-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.admin-content{padding:22px;flex:1}
.sb-backdrop{display:none}.sb-toggle{display:none}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow:auto;padding-bottom:10px}
.kcol{background:var(--n3);border-radius:14px;padding:10px;min-height:300px}
.kcol.over{outline:3px dashed var(--g)}
.kcol h4{font-size:13.5px;display:flex;justify-content:space-between;margin:4px 4px 10px}
.kcard{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:10px;margin-bottom:8px;cursor:grab;font-size:13px;box-shadow:var(--sh)}
.kcard:active{cursor:grabbing}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px}
.mail-item{padding:12px;border-bottom:1px solid var(--bd);cursor:pointer}
.mail-item.on,.mail-item:hover{background:var(--n3)}
.toggle{position:relative;width:46px;height:26px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#b8c4cc;border-radius:99px;cursor:pointer;transition:.2s}
.toggle span::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--g)}.toggle input:checked+span::before{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:3px solid #ffbf47}
#print-root{display:none}
.doc{font-family:Georgia,"Times New Roman",serif;color:#111;max-width:760px;margin:0 auto;padding:30px}
.doc h1{font-family:Arial,sans-serif;color:#003B5C}
.doc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.doc td,.doc th{border:1px solid #ccc;padding:6px 8px;text-align:left}

 body.printing>*:not(#print-root){display:none!important}

}

  [['ANALISIS', 'Otro', 13], ['ANALISIS', 'Tarifa de medidor/contador', 9], ['ANALISIS', 'Otro', 6], ['ANALISIS', 'Reconexión cobrada tras pago', 3],

   ['RADICADA', 'Reconexión cobrada tras pago', 0], ['RADICADA', 'Lectura errónea', 0], ['RADICADA', 'Otro', 1]

  const RC = 'Reconexión cobrada tras pago', LE = 'Lectura errónea', TM = 'Tarifa de medidor/contador';
  const closedPlan = [['PROCEDENTE', RC], ['PROCEDENTE', RC], ['PROCEDENTE', LE], ['NO_PROCEDENTE', LE], ['PROCEDENTE', RC], ['NO_PROCEDENTE', RC], ['CERRADA', LE], ['PROCEDENTE', RC], ['NO_PROCEDENTE', TM], ['PROCEDENTE', LE],
    ['CERRADA', RC], ['PROCEDENTE', RC], ['NO_PROCEDENTE', LE], ['PROCEDENTE', TM], ['CERRADA', LE], ['PROCEDENTE', RC], ['NO_PROCEDENTE', LE], ['PROCEDENTE', LE], ['CERRADA', RC], ['NO_PROCEDENTE', RC],

      req.fechaCierre = iso(fc); req.cierre = p.cierre;
      ev.push({ fecha: at(fc, 17, 0), titulo: 'Caso cerrado', detalle: `Resultado final: ${p.cierre}.`, actor: req.auto ? 'Sistema' : 'Analista: ' + ana });

    if (req.autorizaCorreo) data.emails.push(makeEmail(req, c, 'radicacion', ev[0].fecha));
    if (req.autorizaCorreo && req.fechaResolucion) data.emails.push(makeEmail(req, c, 'respuesta', at(req.fechaResolucion, 16, 21)));
    data.audit.push({ id: uid(), fecha: ev[0].fecha, actor: 'Sistema', accion: 'Radicación de PQR', detalle: `${id} – ${c.nombre}` });
    if (req.fechaResolucion) data.audit.push({ id: uid(), fecha: at(req.fechaResolucion, 16, 20), actor: req.auto ? 'Sistema (STP)' : req.responsable, accion: 'Decisión de ajuste', detalle: `${id}: ${req.resultado.decision}${req.resultado.valorAjustado ? ' · ' + fmtCOP(req.resultado.valorAjustado) : ''}` });
  });
  data.requests.reverse();
  data.audit.sort((a, b) => b.fecha.localeCompare(a.fecha));
  data.emails.sort((a, b) => b.fecha.localeCompare(a.fecha));
  return data;
}

/* ================= MOTOR DE REGLAS (BRMS simulado) ================= */
function evaluate({ client, inv, tipo, fechaPago }, cfg = S.config) {
  const tol = cfg.tolerancia;
  if (!inv) return { estado: 'ANALISIS', decision: 'Requiere análisis', regla: 'R5 – Inconsistencia no resoluble', justificacion: 'No se encontró la factura del periodo reclamado; un analista revisará el caso.', valorAjustado: 0, valorAPagar: 0 };
  if (tipo === 'Reconexión cobrada tras pago') {
    const rec = inv.adicionales.find(a => /Reconexi/i.test(a.concepto));
    const pago = fechaPago === null ? null : (fechaPago || inv.fechaPago);
    if (!rec) return { estado: 'NO_PROCEDENTE', decision: 'No procedente', regla: 'R1 – Sin cobro de reconexión', justificacion: `La factura de ${monthLabel(inv.mes)} no registra cobro de reconexión. Valor a pagar: ${fmtCOP(inv.total)}.`, valorAjustado: 0, valorAPagar: inv.total };
    if (!pago) return { estado: 'ANALISIS', decision: 'Requiere análisis', regla: 'R5 – Pago no conciliado', justificacion: 'No hay pago registrado en recaudo ni fecha de comprobante; un analista verificará el soporte.', valorAjustado: 0, valorAPagar: inv.total };
    if (D(pago) <= D(inv.fechaCorte)) return autoGate({ estado: 'PROCEDENTE', decision: 'Procedente', regla: 'R1 – Pago antes del corte', justificacion: `El pago se registró el ${fmtDate(pago)}, antes de la fecha de corte (${fmtDate(inv.fechaCorte)}). Se emite nota crédito por ${fmtCOP(rec.valor)}, se cancela la orden de corte/reconexión y se actualiza el estado del contrato.`, valorAjustado: rec.valor, valorAPagar: inv.total - rec.valor }, cfg);
    return { estado: 'NO_PROCEDENTE', decision: 'No procedente', regla: 'R1 – Pago posterior al corte', justificacion: `El pago (${fmtDate(pago)}) se registró después de la fecha de corte (${fmtDate(inv.fechaCorte)}); la suspensión y el cobro de reconexión son procedentes según el contrato de condiciones uniformes. Valor a pagar: ${fmtCOP(inv.total)}.`, valorAjustado: 0, valorAPagar: inv.total };
  }
  if (tipo === 'Lectura errónea' || tipo === 'Tarifa de medidor/contador') {
    const avg = clientAvg(client.id, inv.mes); const dev = avg ? (inv.consumo - avg) / avg * 100 : 0;
    const base = `Consumo facturado ${fmtNum(inv.consumo)} ${inv.unidad} frente a un promedio histórico de ${fmtNum(avg)} ${inv.unidad} (${dev >= 0 ? '+' : ''}${fmtDec(dev)} %).`;
    if (Math.abs(dev) <= tol) return { estado: 'NO_PROCEDENTE', decision: 'No procedente', regla: 'R2 – Lectura dentro del rango estadístico', justificacion: `${base} Está dentro de la tolerancia de ±${tol} %, por lo que el cobro se ratifica. Valor a pagar: ${fmtCOP(inv.total)}.`, valorAjustado: 0, valorAPagar: inv.total, desviacion: dev };
    if (client.medidor === 'Inteligente AMI') return { estado: 'VALIDACION_AMI', decision: 'Requiere validación AMI', regla: 'R3 – Desviación con medidor AMI', justificacion: `${base} Supera la tolerancia de ±${tol} %; se consulta la lectura remota del medidor inteligente para re-evaluar.`, valorAjustado: 0, valorAPagar: inv.total, desviacion: dev };
    return { estado: 'VISITA', decision: 'Requiere visita técnica', regla: 'R4 – Desviación con medidor convencional', justificacion: `${base} Supera la tolerancia de ±${tol} % y el medidor es convencional; agenda una visita técnica para verificar la lectura.`, valorAjustado: 0, valorAPagar: inv.total, desviacion: dev };
  }
  return { estado: 'ANALISIS', decision: 'Requiere análisis', regla: 'R5 – Caso no tipificado', justificacion: 'El tipo de inconformidad no puede resolverse con reglas automáticas; se asigna a un analista con control preventivo del SLA.', valorAjustado: 0, valorAPagar: inv.total };
}
function autoGate(res, cfg) {
  if (cfg.autoResolucion) return res;
  return { ...res, estado: 'ANALISIS', decision: 'Procedente – pendiente de aprobación', justificacion: res.justificacion + ' La resolución automática está desactivada: un analista debe aprobar el ajuste.' };
}
function amiRemote(client, inv) { const avg = clientAvg(client.id, inv.mes); const rr = rng(hashStr(inv.id)); const cons = Math.round(avg * (0.96 + rr() * 0.08)); return { cons, lect: inv.lecturaAnterior + cons }; }
function amiReevaluate(req, remOverride) {
  const c = clientById(req.clientId), inv = invById(req.invoiceId); const rem = remOverride || amiRemote(c, inv);
  const dev = (inv.consumo - rem.cons) / rem.cons * 100;
  if (Math.abs(dev) <= S.config.tolerancia) return { estado: 'NO_PROCEDENTE', decision: 'No procedente', regla: 'R3 – Re-evaluación con lectura remota', justificacion: `La lectura remota AMI (${fmtNum(rem.lect)}) confirma el consumo facturado. Valor a pagar: ${fmtCOP(inv.total)}.`, valorAjustado: 0, valorAPagar: inv.total, remote: rem };
  const aj = Math.max(0, Math.round((inv.consumo - rem.cons) * inv.tarifa));
  return { ...autoGate({ estado: 'PROCEDENTE', decision: 'Procedente', regla: 'R3 – Re-evaluación con lectura remota', justificacion: `La lectura remota AMI registra ${fmtNum(rem.lect)} (consumo real ${fmtNum(rem.cons)} ${inv.unidad} frente a ${fmtNum(inv.consumo)} facturados). Se corrige la lectura y se emite nota crédito por ${fmtCOP(aj)}.`, valorAjustado: aj, valorAPagar: inv.total - aj }, S.config), remote: rem };
}
function applyResult(req, res, actor) {
  const prev = req.estado;
  req.resultado = { decision: res.decision, regla: res.regla, justificacion: res.justificacion, valorAjustado: res.valorAjustado || 0, valorAPagar: res.valorAPagar ?? req.valorFacturado };
  req.estado = res.estado;
  if (['PROCEDENTE', 'NO_PROCEDENTE'].includes(res.estado)) {
    req.fechaResolucion = iso(new Date());
    if (res.estado === 'PROCEDENTE') addEvent(req, 'Ajuste aplicado', `Nota crédito por ${fmtCOP(res.valorAjustado)}${req.tipo.startsWith('Reconexión') ? '; orden de corte cancelada y contrato actualizado' : '; lectura del medidor corregida'}.`, actor || 'Sistema');
    addEvent(req, 'Notificación al cliente', `Respuesta enviada${req.autorizaCorreo ? ' y constancia PDF autorizada para envío al correo' : ''}.`, 'Sistema');
    notifyClient(req, `Tu solicitud ${req.id} fue resuelta: ${res.decision}.${res.valorAjustado ? ' Ajuste aplicado: ' + fmtCOP(res.valorAjustado) + '.' : ''}`);
    const c = clientById(req.clientId);
    addAudit('Decisión de ajuste', `${req.id}: ${res.decision}${res.valorAjustado ? ' · ' + fmtCOP(res.valorAjustado) : ''}`, actor || 'Sistema (STP)');
  }
  if (prev !== req.estado) addAudit('Cambio de estado', `${req.id}: ${ESTADOS[prev].label} → ${ESTADOS[req.estado].label}`, actor || 'Sistema');
  const EVT = { PROCEDENTE: 'Tu reclamación fue resuelta a tu favor', NO_PROCEDENTE: 'Tu reclamación fue resuelta', VALIDACION_AMI: 'Estamos validando la lectura de tu medidor inteligente', VISITA: 'Tu caso requiere una visita técnica', ANALISIS: 'Tu caso fue asignado a un analista', RADICADA: 'Recibimos tu solicitud' };
  notifyStatus(req, EVT[req.estado] || 'Tu solicitud cambió de estado', res.justificacion);
}

function createRequest(d) {

/* ================= INTEGRACIÓN CON n8n =================
   La app llama a 5 webhooks de un mismo flujo de n8n (URL base + ruta):
   - epm/copia-solicitud      → correo con copia de la solicitud (botón del cliente/trabajador)
   - epm/estado-reclamacion   → correo automático cada vez que cambia el estado de la reclamación
   - epm/api/consulta-recaudo → API de recaudo (¿hubo pago y fue antes del corte?)
   - epm/api/lectura-ami      → API de telemedida (lectura remota del medidor inteligente)
   - epm/alertas-sla          → resumen de alertas tempranas de SLA al supervisor
   Si no hay URL base configurada, todo funciona en modo simulado dentro de la app. */
const N8N_PATHS = { copia: 'epm/copia-solicitud', estado: 'epm/estado-reclamacion', recaudo: 'epm/api/consulta-recaudo', ami: 'epm/api/lectura-ami', alertas: 'epm/alertas-sla' };
const N8N_LABELS = { copia: 'Copia de la solicitud', estado: 'Correo de cambio de estado', recaudo: 'API de recaudo', ami: 'API de lectura AMI', alertas: 'Resumen de alertas SLA' };
function n8nCfg() { if (!S.n8n) S.n8n = { base: '', notificarEstados: true, usarAPIs: false, correoSupervisor: '' }; return S.n8n; }
function n8nUrl(k) { const b = (n8nCfg().base || '').trim().replace(/\/+$/, ''); return b ? `${b}/${N8N_PATHS[k]}` : ''; }
async function n8nPost(k, payload, { timeout = 9000 } = {}) {
  const url = n8nUrl(k); if (!url) return { ok: false, simulated: true };
  const body = JSON.stringify(payload); const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, signal: ctrl.signal }); clearTimeout(t);
    let data = null; try { data = await res.json(); } catch (e) { }
    return res.ok ? { ok: true, data } : { ok: false, status: res.status, data };
  } catch (e) {
    clearTimeout(t);
    if (k === 'recaudo' || k === 'ami') return { ok: false, error: String(e) }; // las APIs necesitan leer la respuesta
    try { await fetch(url, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ payload: body }) }); return { ok: true, opaque: true }; }
    catch (e2) { return { ok: false, error: String(e2) }; }
  }
}
const viaLabel = r => r.simulated ? 'Simulado (sin n8n)' : r.ok ? (r.opaque ? 'n8n (sin confirmación CORS)' : 'n8n') : 'Error al contactar n8n';

/* 1) Copia de la solicitud (botón "Enviar copia a mi correo") */
async function sendCopyToN8N(reqId, actor) {
  const req = reqById(reqId); if (!req) return;
  if (!req.autorizaCorreo) { toast('El cliente no autorizó el envío de la copia al correo.', 'warn'); return; }
  const c = clientById(req.clientId); const dest = mailOf(req);
  const r = await n8nPost('copia', { ...reqPayload(req), evento: 'copia_solicitud_pqr', asunto: `Copia de tu solicitud ${req.id} – EPM`, constanciaHTML: constanciaHTML(req) });
  const via = viaLabel(r);
  if (!r.ok && !r.simulated) { toast('No se pudo contactar n8n. Verifica la URL base y que el flujo esté activo.', 'err'); addAudit('Error de integración n8n', `${req.id}: copia de solicitud`, 'Sistema'); save(); return false; }
  const em = makeEmail(req, c, 'radicacion'); em.asunto = `Copia de tu solicitud ${req.id}`; em.via = via; S.emails.unshift(em);
  addEvent(req, 'Copia enviada al correo', `${dest} · ${via}`, actor || 'Cliente'); addAudit('Envío de PDF por correo', `${req.id} → ${dest} (${via})`, actor || c.nombre); save();
  toast(r.simulated ? `Copia registrada para <b>${esc(dest)}</b> (modo simulado: configura n8n para enviarla).` : r.opaque ? 'Copia enviada a n8n (sin confirmación por CORS).' : `Copia enviada a <b>${esc(dest)}</b> por n8n.`, r.simulated ? 'info' : r.opaque ? 'warn' : 'ok');
  return true;
}

/* 2) Correo automático de cambio de estado (solo si el cliente autorizó correos) */
function notifyStatus(req, evento, detalle) {
  const cfg = n8nCfg(); if (!req.autorizaCorreo || !cfg.notificarEstados) return;
  const c = clientById(req.clientId); const payload = { ...reqPayload(req), evento, detalleEvento: detalle || '' };
  const em = { id: uid(), reqId: req.id, para: mailOf(req), nombre: c.nombre, fecha: nowISO(), via: 'Enviando…', asunto: `${req.id}: ${evento} – ${ESTADOS[req.estado].label}`, cuerpo: `Hola ${firstName(c.nombre)}:\n\n${evento}.${detalle ? ' ' + detalle : ''}\n\nEstado actual: ${ESTADOS[req.estado].label}\n${req.resultado?.decision ? 'Decisión: ' + req.resultado.decision + '\n' : ''}${req.resultado?.valorAjustado ? 'Valor ajustado: ' + fmtCOP(req.resultado.valorAjustado) + '\n' : ''}Fecha límite de respuesta: ${fmtDate(req.fechaLimite)}\n\nEPM – Atención al cliente (prototipo académico)`, adjunto: `Estado_${req.id}.pdf` };
  S.emails.unshift(em);
  n8nPost('estado', payload).then(r => { em.via = viaLabel(r); addAudit('Correo de estado al cliente', `${req.id} → ${mailOf(req)}: ${evento} (${em.via})`, 'Sistema'); save(); });
}

/* 3) API de recaudo (se usa al radicar reconexiones si está activada) */
async function apiRecaudo(client, inv, fechaPagoDeclarada, referencia) {
  if (!n8nCfg().usarAPIs) return null;
  const r = await n8nPost('recaudo', { contrato: client.contrato, periodo: inv.mes, factura: inv.id, valor: inv.total, fechaVencimiento: inv.vencimiento, fechaCorte: inv.fechaCorte, fechaPagoRegistrada: inv.fechaPago, fechaPagoDeclarada: fechaPagoDeclarada || null, referencia: referencia || null });
  if (!r.ok || !r.data) { toast('La API de recaudo (n8n) no respondió: se usó la validación interna.', 'warn'); return null; }
  return r.data; // { pagoRegistrado, fechaPago, antesDelCorte, fuente, mensaje }
}

/* 4) API de lectura remota AMI */
async function apiAMI(req) {
  if (!n8nCfg().usarAPIs) return null;
  const c = clientById(req.clientId), inv = invById(req.invoiceId);
  const r = await n8nPost('ami', { contrato: c.contrato, medidor: c.medidor, periodo: inv.mes, lecturaAnterior: inv.lecturaAnterior, lecturaFacturada: inv.lecturaActual, consumoFacturado: inv.consumo, promedioHistorico: Math.round(clientAvg(c.id, inv.mes)), unidad: inv.unidad });
  if (!r.ok || !r.data || r.data.lectura == null) { toast('La API AMI (n8n) no respondió: se usó la telemedida simulada.', 'warn'); return null; }
  return { lect: Number(r.data.lectura), cons: Number(r.data.lectura) - inv.lecturaAnterior, fuente: r.data.fuente || 'n8n' };
}

A.scheduleVisit = (id, fromAdmin) => {
  const r = reqById(id); const c = clientById(r.clientId); const d = $('#vs-date').value, fr = $('#vs-fr').value;
  setErr('vs-date', '');
  if (!d) { setErr('vs-date', 'Selecciona una fecha.'); return; }
  const dd = D(d); if (dd <= TODAY) { setErr('vs-date', 'La fecha debe ser posterior a hoy.'); return; }
  if (!isBiz(dd)) { setErr('vs-date', 'Elige un día hábil (lunes a viernes, sin festivos).'); return; }
  const cq = fromAdmin && $('#vs-cq') ? $('#vs-cq').value : (r.visita?.cuadrilla || cuadrillaFor(c));
  const was = !!r.visita;
  r.visita = { fecha: d, franja: fr, cuadrilla: cq, estado: was ? 'Reprogramada' : 'Programada', informe: null };
  r.responsable = cq; if (r.estado !== 'VISITA') r.estado = 'VISITA';
  addEvent(r, was ? 'Visita técnica reprogramada' : 'Visita técnica agendada', `${fmtDate(d)} · ${fr} · ${cq}.`, fromAdmin ? ADMIN_USER : 'Cliente');
  if (fromAdmin) notifyClient(r, `Tu visita técnica para ${r.id} quedó para el ${fmtDate(d)}, ${fr}.`);
  notifyStatus(r, was ? 'Tu visita técnica fue reprogramada' : 'Tu visita técnica quedó agendada', `${fmtDate(d)} · ${fr} · ${cq}.`);
  addAudit(was ? 'Reprogramación de visita' : 'Agendamiento de visita', `${r.id}: ${fmtDate(d)} ${fr}`, fromAdmin ? ADMIN_USER : c.nombre);
  save(); toast(`Visita ${was ? 'reprogramada' : 'agendada'} para el <b>${fmtDate(d)}</b>, ${fr}.`); closeModal(); render();
  if (fromAdmin) A.openReq(id);
};

}

   <div class="row"><button class="btn btn-primary">Guardar parámetros</button><button type="button" class="btn btn-ghost" onclick="confirmDialog('¿Restablecer los parámetros por defecto?',()=>{S.config={...DEFAULT_CONFIG};addAudit('Configuración del motor','Parámetros restablecidos');save();render();toast('Parámetros restablecidos.')})">Restablecer</button></div></form>

}
function simOut() {
  const s = ui.sim; const cf = S.config; let st, txt;
  if (s.tipo.startsWith('Reconexión')) { if (s.pagoAntes === 'si') { st = cf.autoResolucion ? 'PROCEDENTE' : 'ANALISIS'; txt = 'R1: pago antes del corte → nota crédito y cancelación de la orden de corte' + (cf.autoResolucion ? '.' : ' (requiere aprobación: STP desactivado).'); } else if (s.pagoAntes === 'no') { st = 'NO_PROCEDENTE'; txt = 'R1: pago posterior al corte → cobro procedente.'; } else { st = 'ANALISIS'; txt = 'R5: pago no conciliado → analista.'; } }
  else if (s.tipo === 'Otro') { st = 'ANALISIS'; txt = 'R5: caso no tipificado → analista.'; }
  else if (Math.abs(s.desv) <= cf.tolerancia) { st = 'NO_PROCEDENTE'; txt = `R2: ${s.desv} % está dentro de ±${cf.tolerancia} %.`; }
  else if (s.medidor === 'Inteligente AMI') { st = 'VALIDACION_AMI'; txt = `R3: ${s.desv} % supera ±${cf.tolerancia} % → lectura remota y re-evaluación.`; }
  else { st = 'VISITA'; txt = `R4: ${s.desv} % supera ±${cf.tolerancia} % con medidor convencional → visita técnica.`; }
  return `<div class="result ${st === 'PROCEDENTE' ? 'ok' : st === 'NO_PROCEDENTE' ? 'no' : 'wait'}">${chip(st)}<p class="sm" style="margin:8px 0 0">${txt}</p></div>`;
}

  if (!(n.tolerancia >= 5 && n.tolerancia <= 50)) { setErr('cf-tol', 'Entre 5 y 50 %.'); ok = false; }
  if (!(n.alerta >= 1 && n.alerta < n.dictamen)) { setErr('cf-al', 'Debe ser menor que el día de dictamen.'); ok = false; }
  if (!(n.dictamen < n.sla)) { setErr('cf-dic', 'Debe ser menor que el SLA legal.'); ok = false; }
  if (!(n.sla >= 5 && n.sla <= 30)) { setErr('cf-sla', 'Entre 5 y 30 días.'); ok = false; }
  if (!ok) return false; const diff = Object.keys(n).filter(k => n[k] !== S.config[k]).map(k => `${k}: ${S.config[k]} → ${n[k]}`).join(', ');
  S.config = n; addAudit('Configuración del motor', diff || 'Sin cambios'); save(); toast('Parámetros del motor guardados.'); render(); return false; };

  '/clientes/login': { view: renderClientLogin, guest: 'cliente' },
  '/clientes/inicio': { view: renderClientHome, role: 'cliente' },
  '/clientes/facturas': { view: renderClientInvoices, role: 'cliente' },
  '/clientes/solicitudes': { view: renderClientRequests, role: 'cliente' },
  '/clientes/radicar': { view: renderClientFile, role: 'cliente' },
  '/clientes/notificaciones': { view: renderClientNotifs, role: 'cliente' },
  '/admin/login': { view: renderAdminLogin, guest: 'admin' },
  '/admin': { view: renderAdminDash, role: 'admin' },
  '/admin/solicitudes': { view: renderAdminReqs, role: 'admin' },
  '/admin/clientes': { view: renderAdminClients, role: 'admin' },
  '/admin/facturacion': { view: renderAdminBilling, role: 'admin' },
  '/admin/visitas': { view: renderAdminVisits, role: 'admin' },
  '/admin/reglas': { view: renderAdminRules, role: 'admin' },
  '/admin/reportes': { view: renderAdminReports, role: 'admin' },
};
const TITLES = { '/': 'EPM – Inicio', '/clientes/login': 'Portal de clientes – Ingreso', '/admin/login': 'Consola de trabajadores – Ingreso' };
function go(path) { if (location.hash === '#' + path) render(); else location.hash = '#' + path; }
function currentPath() { let p = location.hash.replace(/^#/, '') || '/'; if (p === '/clientes') p = '/clientes/login'; return p; }
function guard(path) {
  const rt = ROUTES[path]; if (!rt) return '/';
  if (rt.role === 'admin') { if (!session) return '/admin/login'; if (session.role !== 'admin') { toast('Acceso denegado: tu perfil de cliente no puede abrir la consola de trabajadores.', 'err'); return '/clientes/inicio'; } }
  if (rt.role === 'cliente') { if (!session) return '/clientes/login'; if (session.role !== 'cliente') { toast('Tienes sesión de trabajador: te llevamos a tu consola.', 'info'); return '/admin'; } if (!me()) { setSession(null); return '/clientes/login'; } }
  if (rt.guest && session) return session.role === 'admin' ? '/admin' : '/clientes/inicio';
  if (path.startsWith('/admin') && path !== '/admin/login' && !ROUTES[path]) return '/admin';
  return null;
}
let slideTimer = null;
function render() {
  let path = currentPath(); const red = guard(path);
  if (red && red !== path) { history.replaceState(null, '', '#' + red); path = red; }
  const isAdmin = path.startsWith('/admin') && path !== '/admin/login';
  document.body.classList.toggle('dark', isAdmin && ui.dark);
  const changed = ui.lastRoute !== path; ui.lastRoute = path;
  const app = $('#app');
  if (changed && ROUTES[path].role) { app.innerHTML = skeleton(isAdmin); setTimeout(() => { if (ui.lastRoute === path) { app.innerHTML = ROUTES[path].view(); after(path); } }, 220); }
  else { app.innerHTML = ROUTES[path].view(); after(path); }
  if (changed) { window.scrollTo(0, 0); document.title = (TITLES[path] || (isAdmin ? 'Consola EPM' : 'Portal de clientes EPM')) + ' · Prototipo académico'; }
}
function skeleton(admin) { return admin ? `<div class="admin"><aside class="sidebar"></aside><div class="admin-main" style="padding:22px"><div class="skel" style="height:40px;width:40%"></div><div class="grid g4 mt">${'<div class="skel" style="height:84px"></div>'.repeat(4)}</div><div class="skel mt" style="height:300px"></div></div></div>` : `<div class="wrap portal-main"><div class="skel" style="height:120px"></div><div class="grid g3 mt">${'<div class="skel" style="height:200px"></div>'.repeat(3)}</div></div>`; }
function after(path) {
  clearInterval(slideTimer);
  if (path === '/') slideTimer = setInterval(() => { if (document.hidden) return; A.slideTo((ui.slide + 1) % SLIDES.length); }, 7000);
  if (path === '/clientes/login' && isLocked('cliente')) startLockTicker('cliente', 'lc');
  if (path === '/admin/login' && isLocked('admin')) startLockTicker('admin', 'la');
  if (ui.chat.open) chatRefresh();
}
window.addEventListener('hashchange', () => { closeAllModals(); render(); });
window.addEventListener('storage', e => { if (e.key === STORE_KEY) { loadData(); render(); } });

loadPrefs(); loadData(); loadSession(); render();
</script></body></html>
